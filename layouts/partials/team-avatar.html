{{/*
  Minimalist generated "bot" avatar for a team member.
  Expects a dict: name, gradientFrom, gradientTo, accent, accessory
*/}}
{{ $gid := printf "avatar-grad-%s" (.name | urlize) }}
{{ $accent := .accent }}
<svg viewBox="0 0 96 96" class="team-avatar-svg" role="img" aria-label="{{ .name }} avatar">
  <defs>
    <linearGradient id="{{ $gid }}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{ .gradientFrom }}"></stop>
      <stop offset="100%" stop-color="{{ .gradientTo }}"></stop>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#{{ $gid }})"></rect>
  <circle cx="48" cy="52" r="30" fill="rgba(255,255,255,0.08)"></circle>

  {{ if eq .accessory "spikes" }}
    <polygon points="24,20 30,4 36,20" fill="{{ $accent }}"></polygon>
    <polygon points="41,16 48,2 55,16" fill="{{ $accent }}"></polygon>
    <polygon points="60,20 66,4 72,20" fill="{{ $accent }}"></polygon>
  {{ else if eq .accessory "crown" }}
    <polygon points="30,20 34,6 42,16 48,4 54,16 62,6 66,20" fill="{{ $accent }}"></polygon>
    <circle cx="48" cy="9" r="2.5" fill="{{ $accent }}"></circle>
  {{ else if eq .accessory "headphones" }}
    <path d="M20 40 A28 28 0 0 1 76 40" fill="none" stroke="{{ $accent }}" stroke-width="4" stroke-linecap="round"></path>
    <rect x="14" y="38" width="10" height="18" rx="5" fill="{{ $accent }}"></rect>
    <rect x="72" y="38" width="10" height="18" rx="5" fill="{{ $accent }}"></rect>
  {{ else if eq .accessory "cat-ears" }}
    <polygon points="22,26 18,4 38,18" fill="{{ $accent }}"></polygon>
    <polygon points="74,26 78,4 58,18" fill="{{ $accent }}"></polygon>
  {{ else if eq .accessory "bolt" }}
    <polygon points="50,14 40,34 47,34 42,50 60,28 51,28 56,14" fill="{{ $accent }}"></polygon>
  {{ else if eq .accessory "bow" }}
    <polygon points="34,10 46,16 34,22" fill="{{ $accent }}"></polygon>
    <polygon points="62,10 50,16 62,22" fill="{{ $accent }}"></polygon>
    <circle cx="48" cy="16" r="3.5" fill="{{ $accent }}"></circle>
  {{ else if eq .accessory "antenna" }}
    <line x1="48" y1="6" x2="48" y2="20" stroke="{{ $accent }}" stroke-width="3" stroke-linecap="round"></line>
    <circle cx="48" cy="5" r="4" fill="{{ $accent }}"></circle>
  {{ else if eq .accessory "halo" }}
    <ellipse cx="48" cy="12" rx="16" ry="5" fill="none" stroke="{{ $accent }}" stroke-width="3"></ellipse>
  {{ end }}

  {{ if eq .accessory "visor" }}
    <rect x="30" y="45" width="36" height="10" rx="5" fill="{{ $accent }}" opacity="0.85"></rect>
    <line x1="35" y1="50" x2="45" y2="50" stroke="rgba(2,6,23,0.5)" stroke-width="1.5" stroke-linecap="round"></line>
  {{ else }}
    <circle cx="36" cy="50" r="4.5" fill="#020617"></circle>
    <circle cx="60" cy="50" r="4.5" fill="#020617"></circle>
    <circle cx="37.5" cy="48.5" r="1.3" fill="#ffffff" opacity="0.9"></circle>
    <circle cx="61.5" cy="48.5" r="1.3" fill="#ffffff" opacity="0.9"></circle>
  {{ end }}

  {{ if eq .accessory "mustache" }}
    <path d="M32 60 Q40 56 48 60 Q56 56 64 60" fill="none" stroke="{{ $accent }}" stroke-width="3.5" stroke-linecap="round"></path>
  {{ else }}
    <path d="M38 62 Q48 70 58 62" fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round"></path>
  {{ end }}
</svg>
