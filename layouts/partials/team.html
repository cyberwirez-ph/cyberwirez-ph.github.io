<section class="team-section">
  <div class="team-grid">
    {{ range hugo.Data.team }}
      <div class="team-card">
        <div class="team-avatar">
          {{ partial "team-avatar.html" . }}
        </div>
        <span class="team-name">{{ .name }}</span>
        {{ if .role }}<span class="team-role">{{ .role }}</span>{{ end }}
        {{ if .tagline }}<span class="team-tagline">{{ .tagline }}</span>{{ end }}
      </div>
    {{ end }}
  </div>
</section>
