baseURL = "https://cyberwirez-ph.github.io/"
languageCode = "en-us"
title = "cyberwirez"
theme = "mana"

# Tag/taxonomy browsing pages removed per team request.
disableKinds = ["taxonomy", "term"]

[pagination]
  pageSize = 10

[outputs]
  home = ["HTML", "JSON"]

[params]
  description = "A Philippine Cybersecurity Community"
  footerText = "© 2026 cyberwirez. Built with Hugo and Mana theme"
  heroTitleLine1 = "cyberwirez"

  [params.avatar]
    [params.avatar.home]
      assetPath = "images/cyberwirez.png"
    [params.avatar.about]
      assetPath = "images/cyberwirez.png"

  [params.social]
    github = "https://github.com/cyberwirez-ph"
    email = "cyberwirez.sec@gmail.com"

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Articles"
  pageRef = "/articles"
  weight = 25

[[menus.main]]
  name = "Achievements"
  pageRef = "/achievements"
  weight = 30

[[menus.main]]
  name = "Moderators"
  pageRef = "/moderators"
  weight = 35

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 40
